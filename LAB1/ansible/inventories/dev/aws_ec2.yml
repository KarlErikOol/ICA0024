# Dynamic inventory for DEV: asks AWS for running instances tagged
# Project=iac-lab1 and Environment=dev, so no IP address is ever written down.
#   ansible-inventory -i inventories/dev --graph
plugin: amazon.aws.aws_ec2
regions:
  - eu-north-1
filters:
  tag:Project: iac-lab1
  tag:Environment: dev
  instance-state-name: running
# All servers share a Name tag, so add the instance id: iac-lab1-dev-web-i-0abc...
hostnames:
  - name: instance-id
    prefix: tag:Name
    separator: "-"
# AWS data arrives as aws_* host vars (aws_tags, aws_instance_id, ...), so it
# can't clash with Ansible's own names such as "tags".
hostvars_prefix: aws_
compose:
  ansible_host: aws_public_ip_address
# Role=web -> group "role_web"
keyed_groups:
  - key: aws_tags.Role
    prefix: role
