# Remove everything infra.yml created for ONE environment; the other keeps
# running. The shared AMI is kept (rebuilding takes ~5 min) unless you pass
# -e purge_amis=true, which is refused while any environment still has servers.
- name: Tear down AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Require an environment
      ansible.builtin.assert:
        that: env_name is defined
        fail_msg: "No environment selected. Use: ansible-playbook -i inventories/<env> destroy.yml"

    - name: Terminate {{ env_name }} servers
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        state: absent
        filters:
          tag:Project: "{{ project }}"
          tag:Environment: "{{ env_name }}"
          instance-state-name: [pending, running, stopping, stopped]
        wait: true

    # Only possible once no instance uses it any more.
    - name: Delete security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "{{ sg_name }}"
        state: absent

    - name: Delete key pair
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: "{{ key_name }}"
        state: absent

    # The AMI is shared, so only delete it once no environment needs it.
    - name: Look for servers in other environments
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          tag:Project: "{{ project }}"
          instance-state-name: [pending, running, stopping, stopped]
      register: remaining
      when: purge_amis | default(false) | bool

    - name: Refuse to delete the AMI while it is still in use
      ansible.builtin.assert:
        that: remaining.instances | length == 0
        fail_msg: >-
          Servers still exist ({{ remaining.instances | map(attribute='tags.Environment', default='untagged') | unique | join(', ') }}).
          Destroy those environments first.
      when: purge_amis | default(false) | bool

    - name: Find AMIs
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: self
        filters:
          name: "{{ ami_name_prefix }}-*"
      register: ami_info
      when: purge_amis | default(false) | bool

    - name: Deregister AMIs and delete their snapshots
      amazon.aws.ec2_ami:
        region: "{{ aws_region }}"
        image_id: "{{ item.image_id }}"
        state: absent
        delete_snapshot: true
      loop: "{{ ami_info.images | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: purge_amis | default(false) | bool
